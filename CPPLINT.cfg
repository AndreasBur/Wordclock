set noparent
# Google puts the project in front of the path in a header guard, as in
# LIB_SRC_LIB_ERROR_H_. cpplint derives the guard from the path below
# root, so root is the parent of the checkout, and the checkout has to be
# named as the library, as Arduino names the folder of the library anyway.
root=..
extensions=h,cpp,ino
# clang-format, with the Google style, sets the indentation within a
# namespace already, and cpplint takes the lines it wraps there, a trailing
# return type or a long initializer, for indented ones.
filter=-whitespace/indent_namespace
# Wordclock's own: 100 columns, as .clang-format's ColumnLimit says and gives the reason for.
linelength=100
# Wordclock's own: cpplint takes a NOLINTBEGIN of clang-tidy's checks for none, as they are
# another tool's, and then reports the NOLINTEND that closes it as outside a block. Wordclock's
# NOLINTBEGIN blocks around several functions go when it takes CodingStyle.md S-2.
filter=-readability/nolint
# Wordclock's own: the check knows words, not types, and takes every variable named string -
# 134 of them, char buffers - for std::string, which no source of src/ uses.
filter=-build/include_what_you_use
