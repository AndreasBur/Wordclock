# What a pull request is checked with. Six jobs, because the project has six ways of
# building and each of them can break on its own:
#
#   simulator      the firmware core through the wxWidgets backend, plus its regression tests
#   host-tests     the ESP32 backend compiled against the stand-ins in platform/esp32/test
#   rp2350-host    the same arrangement for the Pico's backend, stubs and all
#   firmware       the ESP32 backend compiled for the board it actually runs on
#   rp2350         the Pico 2 W's firmware, which is where the flash layout is checked
#   avr-dx         the AVR128DA48 backend, cross-compiled, plus tools/documented-sizes.py
#
# A firmware job looks redundant next to its host tests and is not. The host tests compile the same
# sources with the host's compiler and libc, so anything the target's toolchain has a
# different opinion about passes them - newlib not declaring timegm, for one, which broke
# the target build while every host test stayed green. That argument carries further for
# the fourth: an 8-bit freestanding target with its own -mmcu has more opinions than the
# ESP32, not fewer, and nothing else in this file compiles a line of platform/avr-dx.
#
# What the code says rather than whether it builds is static-analysis.yml, which used to be
# a fourth job here. It is its own workflow because a badge reports a workflow: the README
# says separately that the builds pass and that the analysers are quiet.
#
# Not run through the dev container. devcontainers/ci would give exact parity with what a
# developer has, at the price of building that image on every run, and these jobs are meant
# to answer in minutes.
#
# So the versions here are near what a developer has rather than equal to it, and the gap is
# worth knowing: the runners are Ubuntu 24.04 where the dev container is 26.04, and the AVR
# job is a Debian container for the reason given at that job. That gap has already reported
# something true - cppcheck is older here than in the image, and the difference cost a red
# badge over the format of the suppression file. Parity would have hidden it.
# Every job carries a timeout-minutes, set well above what it takes rather than close to it:
# they are there for a job that has stopped making progress, not for one that is slow. A
# README-only commit once hung twice - apt-get update on the simulator job, and the cppcheck
# job before its first step ran at all - and without a timeout the two sat there until
# GitHub's own six-hour limit cancelled them, which reports as a red badge six hours after
# anyone would have looked. The numbers differ per job because the cold-cache cost does: the
# RP2350 firmware clones arduino-pico with the Pico SDK, and that alone is several minutes.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  # So release.yml can run this file rather than repeat it. A release is then by construction
  # something the whole of CI has passed, and the binaries it publishes are the ones those
  # jobs produced - not a second build of the same tag that could differ in a toolchain
  # version nobody pinned.
  workflow_call:

# A second push to the same branch makes the first answer worthless, so it is cancelled
# rather than left to occupy a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator and core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned to the Ubuntu that carries wxWidgets 3.2, which is what
      # find_package(wxWidgets) expects; libwxgtk3.2-dev pulls in the wx-config it needs.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libwxgtk3.2-dev

      # -Werror only here, not in the CMakeLists: a warning should stop a change from
      # being merged without stopping somebody in the middle of debugging one.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPLATFORM=simulator -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build

      # No display needed: the tests drive the firmware core and the pixel buffer, and the
      # window that renders it is never constructed.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  host-tests:
    name: ESP32 backend on the host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Needs nothing but g++, python3 and node, which the runner already carries. The
      # script compiles into an object cache under .pio/ and links from there.
      - name: Run the host tests
        run: platform/esp32/test/run.sh

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The platform, the Xtensa toolchain and the Arduino core are about 1.5 GB and are
      # downloaded on first use. Restoring them costs a minute or two, which is still less
      # than fetching them, and the key changes only when the build configuration does.
      - name: Cache the PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: platformio-${{ runner.os }}-${{ hashFiles('platform/esp32/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # WordclockSecrets.h is not in the repository, so this builds with the defaults in
      # WordclockConfiguration.h - an empty SSID, which is a clock that runs without a
      # network rather than a build that fails.
      - name: Build the firmware
        run: pio run -d platform/esp32

      # Two files because they answer different questions. firmware.bin is the image an
      # over-the-air update takes; firmware.factory.bin is the whole flash including the
      # bootloader and the partition table, which is what somebody holding a bare board
      # needs and the one that is useless to leave out. if-no-files-found: error because a
      # renamed build output would otherwise publish an empty release and say nothing.
      - name: Keep the firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp32-s3-firmware
          path: |
            platform/esp32/.pio/build/wordclock/firmware.bin
            platform/esp32/.pio/build/wordclock/firmware.factory.bin
          if-no-files-found: error

  host-tests-rp2350:
    name: RP2350 backend on the host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same as the ESP32's: nothing but g++ and python3, because the backend is compiled
      # against the stand-ins in test/stubs rather than the real core. Two of the four case
      # files are the ones under platform/test, shared with that job.
      - name: Run the host tests
        run: platform/rp2350/test/run.sh

  firmware-rp2350:
    name: RP2350 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Larger and slower to fetch than the ESP32's, because this platform clones
      # earlephilhower/arduino-pico recursively rather than downloading a package: around
      # 1.5 GB with the Pico SDK and its submodules, and several minutes. Its own cache key
      # rather than a shared one, so a change to either platformio.ini does not throw the
      # other's toolchain away.
      - name: Cache the PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: platformio-rp2350-${{ runner.os }}-${{ hashFiles('platform/rp2350/platformio.ini') }}
          restore-keys: platformio-rp2350-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # As on the ESP32: no WordclockSecrets.h in the repository, so this builds with the
      # empty SSID that leaves a clock running without a network.
      - name: Build the firmware
        run: pio run -d platform/rp2350

      # The .uf2 first: the Pico mounts as a mass storage device and installing is copying
      # that file onto it, with no tool to install and nothing to go wrong. The .bin is kept
      # beside it for picotool and for an over-the-air update.
      - name: Keep the firmware
        uses: actions/upload-artifact@v7
        with:
          name: rp2350-firmware
          path: |
            platform/rp2350/.pio/build/wordclock/firmware.uf2
            platform/rp2350/.pio/build/wordclock/firmware.bin
          if-no-files-found: error

  # The one job that does not use the runner's own packages, and the reason is the whole
  # story of this job. ubuntu-24.04 carries avr-gcc 7.3, which fails this build twice over:
  # it has no device-specs for avr128da48, and once handed those from a Microchip pack it
  # rejects the core's constexpr constructors - "temporary of non-literal type ClockWords
  # in a constant expression", which GCC 12 onwards accepts. Making the shared core worse
  # to satisfy a compiler no developer here uses would be the wrong way round, so the job
  # takes a distribution whose avr-gcc is the one platform/avr-dx/README.md asks for. That
  # also removes the need for a device pack: from 12 onwards the specs are in the box.
  avr-dx:
    name: AVR Dx firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:trixie
    steps:
      # Before the checkout, and with two packages the runner images have but a plain
      # Debian does not: git, without which checkout falls back to the REST API, and
      # ca-certificates, without which its fetch fails on "Problem with the SSL CA cert"
      # rather than on anything to do with this repository.
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build gcc-avr avr-libc python3

      - uses: actions/checkout@v7

      # Asked before the build rather than met inside it. Whether an avr-gcc knows this part
      # is a property of its device-specs, and a build that walks into a missing one stops
      # halfway with an error that reads like a broken checkout rather than a toolchain that
      # is too old. The version is printed beside it, because that is the thing that decides.
      - name: Check the toolchain knows the device
        run: |
          avr-gcc --version | head -1
          avr-gcc -mmcu=avr128da48 -E -x c /dev/null -o /dev/null

      # The toolchain has to be named when the build directory is created: a compiler cannot
      # be swapped after project() has run, which is why -DPLATFORM=avr-dx alone refuses.
      # -G Ninja for the same reason as the simulator job, and for one more: a plain Debian
      # image has no make, so the generator CMake would otherwise default to is the one
      # thing here that is not installed.
      - name: Configure
        run: |
          cmake -B build-avr -S . -G Ninja -DPLATFORM=avr-dx \
                -DCMAKE_TOOLCHAIN_FILE=platform/avr-dx/toolchain-avr.cmake

      # The size is printed by the link rule itself. It is the reason this part was chosen,
      # so a change that stops fitting says so here rather than on somebody's bench.
      - name: Build
        run: cmake --build build-avr

      # And the size written in the documentation is compared against the one just built.
      # Every size in this repository has been wrong at least once, always the same way - the
      # code grew and the sentence did not - and twice a corrected number was made wrong again
      # by the next change within a day. This is the only moment that is cheap to fix: the
      # pull request that moved it. python3 is installed above for this step alone.
      - name: Check the documented sizes
        run: python3 tools/documented-sizes.py --elf build-avr/platform/avr-dx/Wordclock.elf

      # The .hex is what pymcuprog and avrdude write; the .elf goes with it because it is
      # the only one of the two that still knows the symbols, and a report about a clock in
      # somebody's living room is worth little without the binary it ran.
      - name: Keep the firmware
        uses: actions/upload-artifact@v7
        with:
          name: avr128da48-firmware
          path: |
            build-avr/platform/avr-dx/Wordclock.hex
            build-avr/platform/avr-dx/Wordclock.elf
          if-no-files-found: error
