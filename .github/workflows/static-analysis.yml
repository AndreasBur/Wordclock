# What a pull request is read with, next to what it is built with in ci.yml. The clang-tidy
# job was a fourth job there and is the same job here, moved: a badge reports a workflow and
# not a job, so this is what puts a static-analysis badge in the README beside the CI one.
# CI is now the three builds and the tests, this is what reads the code, and neither answer
# hides inside the other's.
#
# Two analysers, because they are good at different things. clang-tidy sees exactly what the
# compiler sees - the real include paths and defines out of compile_commands.json - and
# brings the path-sensitive clang-analyzer checks with it. cppcheck parses the tree by
# itself, which is how it reaches template instantiations and container bounds that the
# clang checks do not follow: it is the one that noticed the parameter parser being
# instantiated with an empty table.
#
# Which checks are on, and why the rest are off, is in .clang-tidy and
# .cppcheck-suppressions, not here.
#
# The comments are read as well: clang-tidy reads every Doxygen block with -Wdocumentation, and
# the docs job has Doxygen read them, which is what notices a block that leaves out a
# parameter. What a block holds is docs/documentation.md.
#
# And every header is compiled on its own, once per build, so that none of them compiles only
# because of what its includers brought along. The tests are read too: the coverage job reports
# which lines of firmware/ none of them runs, and the sanitizers job runs them all again under
# AddressSanitizer and UndefinedBehaviorSanitizer.
# clang-tidy reads four builds, not one. The simulator's covers the firmware core as the
# host compiler sees it; each hardware backend is only ever compiled by its own cross
# compiler, so it is read through that build's database - rewritten by
# tools/cross-clang-tidy.py so that clang can follow what GCC was told. The core is read
# again in each of them, which is the point: an int is 16 bit on the AVR, and a check that
# only ever saw the host would never meet the code the way that target does.
#
# timeout-minutes on every job for the reason ci.yml gives, and generous on clang-tidy: it
# reads every translation unit of the simulator build and takes ten minutes when nothing at
# all is wrong.
name: static-analysis

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same branch makes the first answer worthless, so it is cancelled
# rather than left to occupy a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # wxWidgets is here for the same reason as in the simulator job of ci.yml: the
      # simulator's compile database is what covers the firmware core, and it does not
      # exist without the headers the backend includes.
      - name: Install the toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake ninja-build libwxgtk3.2-dev clang-tidy

      # Configured, not built: clang-tidy compiles each translation unit itself and needs
      # nothing from the build but compile_commands.json.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPLATFORM=simulator -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # The one exception to "not built". WebPage.h holds the two pages as arrays and is
      # generated rather than checked in, so a translation unit that includes it does not
      # compile until the rule has run - and clang-tidy reports that as the file being
      # missing, which reads like a bad include path rather than a build step that was
      # skipped. It is the python script and nothing else, so it costs no build time.
      - name: Generate the embedded pages
        run: cmake --build build --target WordclockWebPage

      # Which checks, and why the rest are off, is in .clang-tidy. WarningsAsErrors is set
      # there, so a finding fails this job.
      - name: Analyse
        run: run-clang-tidy -p build -quiet -j "$(nproc)" 'firmware/|platform/simulator/src'

      # Every header compiled as the only include of an empty file, by the compiler and with
      # the flags the database records. A header that leans on what its includers happen to
      # include first builds everywhere until one of them stops - tools/self-contained-headers.py
      # says why that is not a finding any analyser above can make. Each backend's job runs it
      # again with its own compiler, because the #if branches a header takes are the target's.
      - name: Headers on their own
        run: python3 tools/self-contained-headers.py build firmware/inc platform/simulator/include

      # The names are the same everywhere, the tests and the window included, which the run
      # above leaves out: what the other checks would say about test scaffolding is not worth
      # answering, but a test written in the old names reads as the old code. Seconds, not
      # minutes - one check.
      - name: Names in the tests and the window
        run: run-clang-tidy -p build -quiet -j "$(nproc)" -checks='-*,readability-identifier-naming' 'platform/simulator/(tests|Wordclock)'

      # The backends' host tests are compiled by their own run.sh and by nothing CMake or
      # PlatformIO sees, so their names are read through the compile database run.sh writes.
      # That takes python3, for the database and the generated page, and nothing else: no
      # PlatformIO and no cross compiler, the stubs stand in for both.
      - name: Names in the host tests
        run: |
          for backend in esp32 rp2350; do
            "platform/$backend/test/run.sh" compiledb
            run-clang-tidy -p "platform/$backend/.pio/host-tests" -quiet -j "$(nproc)" -checks='-*,readability-identifier-naming' 'platform/'
          done

  clang-tidy-avr:
    name: clang-tidy (AVR Dx)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The cross compiler is installed although nothing is compiled with it: the tool asks it
      # where avr-libc's headers are, and clang reads those instead of the host's.
      - name: Install the toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake ninja-build gcc-avr avr-libc clang-tidy python3

      # Configured, not built, as above. The toolchain file for the same reason ci.yml names
      # it: the database records whichever compiler project() found.
      - name: Configure
        run: |
          cmake -B build-avr -S . -G Ninja -DPLATFORM=avr-dx \
                -DCMAKE_TOOLCHAIN_FILE=platform/avr-dx/toolchain-avr.cmake \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Analyse
        run: python3 tools/cross-clang-tidy.py build-avr 'firmware/|platform/avr-dx/src'

      # As in the clang-tidy job, by avr-g++, which this job installs for the tool above anyway.
      - name: Headers on their own
        run: python3 tools/self-contained-headers.py build-avr firmware/inc platform/avr-dx/include

  clang-tidy-platformio:
    name: clang-tidy (${{ matrix.backend }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      # One backend's findings say nothing about the other's, so both are reported.
      fail-fast: false
      matrix:
        include:
          - backend: esp32
            cache: platformio
          - backend: rp2350
            cache: platformio-rp2350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The same keys as the firmware jobs in ci.yml, so whichever of the two runs first
      # fills the cache for the other - the toolchains are the slow part of this job too.
      - name: Cache the PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ matrix.cache }}-${{ runner.os }}-${{ hashFiles(format('platform/{0}/platformio.ini', matrix.backend)) }}
          restore-keys: ${{ matrix.cache }}-${{ runner.os }}-

      - name: Install clang-tidy
        uses: ./.github/actions/apt-install
        with:
          packages: clang-tidy

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # compiledb rather than a build: it fetches the platform, runs the pre-scripts - which
      # is what writes WebPage.h - and writes the database, and compiles nothing.
      - name: Write the compile database
        run: pio run -d platform/${{ matrix.backend }} -t compiledb

      - name: Analyse
        run: python3 tools/cross-clang-tidy.py platform/${{ matrix.backend }} 'firmware/|platform/${{ matrix.backend }}/src'

      # As in the clang-tidy job, by the board's own compiler out of the PlatformIO packages.
      - name: Headers on their own
        run: python3 tools/self-contained-headers.py platform/${{ matrix.backend }} firmware/inc platform/${{ matrix.backend }}/include

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No cmake, no wxWidgets, no compile database: cppcheck is given the include
      # directories and works out the configurations itself, which for the firmware core is
      # enough - it reports the same findings with and without compile_commands.json, and
      # this way the job still answers when the simulator does not build.
      - name: Install cppcheck
        uses: ./.github/actions/apt-install
        with:
          packages: cppcheck

      # firmware/ only, unlike the clang-tidy job above. Without wxWidgets' own headers
      # cppcheck stops at DECLARE_EVENT_TABLE in the simulator's window class and asks to be
      # told what the macro is; the backend is the half clang-tidy covers through the
      # compile database, and this is the half that needs no toolchain to read.
      #
      # --enable: warning and portability, not style or performance. Those two are where
      # "could be static", "could be const&" and "could return a reference" live - 270 of
      # them, about how the code is written rather than what it does, and the same argument
      # .clang-tidy makes for leaving the style checks out.
      # --check-level=exhaustive costs nothing measurable at this size (~4 s either way).
      # --inline-suppr so a one-off can be answered next to the code, with the reason there,
      # rather than by widening .cppcheck-suppressions to a whole file.
      #
      # Both analysers use Ubuntu 26.04 packages, as in the dev container. Package
      # updates can still introduce new findings between image rebuilds.
      - name: Analyse
        run: |
          INCLUDES=$(find firmware/inc -type d | sed 's/^/-I/')
          cppcheck \
            --enable=warning,portability \
            --check-level=exhaustive \
            --std=c++17 \
            --inline-suppr \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=1 \
            --quiet \
            $INCLUDES \
            -Iplatform/simulator/include/sim \
            -Iplatform/simulator/include \
            firmware/src firmware/inc

  # Which lines of firmware/ the tests run, as a table in the job's summary - the least covered
  # files first, because the gaps are what it is for. Read rather than enforced: there is no
  # threshold, so a pull request is never held up by a number, and the job fails only when a
  # test does. All three suites at once, because each alone reads as a gap where another
  # covers it: the core tests never reach the command line, which the host suites drive through
  # the web socket. Here rather than in ci.yml because it reads the tests and builds nothing a
  # release would ship, and ci.yml is what release.yml runs.
  #
  # Cheap: the test binaries only - no simulator window, no PlatformIO, no cross compiler. How
  # the instrumented builds are made, and why -O0, is in tools/coverage.py.
  coverage:
    name: Coverage report
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake ninja-build libwxgtk3.2-dev

      - name: Build the core tests with --coverage
        run: |
          cmake -S . -B build-cov -G Ninja -DPLATFORM=simulator \
                -DCMAKE_CXX_FLAGS="--coverage -O0" -DCMAKE_EXE_LINKER_FLAGS=--coverage
          cmake --build build-cov --target WordclockTests

      - name: Run the three suites
        run: |
          ctest --test-dir build-cov --output-on-failure
          HOST_TESTS_CXXFLAGS="--coverage -O0" platform/esp32/test/run.sh
          HOST_TESTS_CXXFLAGS="--coverage -O0" platform/rp2350/test/run.sh

      - name: Report
        run: |
          python3 tools/coverage.py --summary "$GITHUB_STEP_SUMMARY" \
              build-cov platform/esp32/.pio/host-tests platform/rp2350/.pio/host-tests

  # The same three suites, built with AddressSanitizer and UndefinedBehaviorSanitizer. A test
  # whose code reads an uninitialised variable, runs past an array or shifts by more than the
  # width passes as long as the host happens to do what was expected; this is what makes it
  # fail. It found its first one before it was merged: shifting a row off the grid handed
  # WritePixel() a bool that GetPixel() had refused to fill.
  #
  # -fno-sanitize-recover=all so that a finding ends the run instead of being a line in a log
  # that passed. Leak checking is on as well, which is AddressSanitizer's default here. Beside
  # coverage, and not in ci.yml, for the reason that job gives.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake ninja-build libwxgtk3.2-dev

      - name: Build the core tests
        run: |
          cmake -S . -B build-san -G Ninja -DPLATFORM=simulator \
                -DCMAKE_CXX_FLAGS="$SANITIZE" -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE"
          cmake --build build-san --target WordclockTests

      - name: Run the three suites
        run: |
          ctest --test-dir build-san --output-on-failure
          HOST_TESTS_CXXFLAGS="$SANITIZE" platform/esp32/test/run.sh
          HOST_TESTS_CXXFLAGS="$SANITIZE" platform/rp2350/test/run.sh

  # The tests run what somebody thought of; this runs what nobody did. libFuzzer makes up
  # inputs for the two ways data from outside reaches the firmware - a command line as a
  # browser's web socket frame brings it, and a stored blob as Persistence::Load() reads it -
  # under the same two sanitizers, steered by which branches of the core each input reaches.
  # What the fuzzers are and how to run them is platform/simulator/tests/fuzz/run.sh.
  #
  # Three minutes each, side by side, on every pull request. Short for a fuzzer, which is why
  # the corpus is cached: every run starts from the inputs all earlier runs found, so the
  # minutes add up across pull requests rather than starting over. The key is new on every
  # run, so every run saves, and restore-keys takes the newest. A missing line in a parser was
  # put in on purpose to see the job do its work: it was found in one second.
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # llvm for llvm-symbolizer, without which a finding is a stack of addresses; clang-tidy
      # for the names below.
      - name: Install the toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: cmake ninja-build libwxgtk3.2-dev clang libclang-rt-dev llvm clang-tidy

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: fuzz-work/*/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build the fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja -DPLATFORM=simulator \
                -DCMAKE_CXX_COMPILER=clang++ -DWORDCLOCK_BUILD_FUZZERS=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-fuzz --target FuzzCommand FuzzSettings

      # The fuzzers are in no build the clang-tidy job reads, so their names are read here,
      # through this build's own database.
      - name: Names in the fuzzers
        run: run-clang-tidy -p build-fuzz -quiet -j "$(nproc)" -checks='-*,readability-identifier-naming' 'platform/simulator/tests/fuzz'

      - name: Fuzz
        run: platform/simulator/tests/fuzz/run.sh build-fuzz 180 fuzz-work

      # The input that failed, so it can be replayed: build-fuzz/bin/<fuzzer> crash-<hash>.
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            fuzz-work/*/crash-*
            fuzz-work/*/log.txt
          if-no-files-found: ignore

  docs:
    name: Doxygen blocks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install doxygen
        uses: ./.github/actions/apt-install
        with:
          packages: doxygen

      # Once per backend, over firmware/ and that backend: a \param that names no parameter, a
      # command Doxygen does not know, an entity without a block or a block that leaves
      # something out. docs/documentation.md says what a block holds. The runner's python3 is
      # enough.
      - name: Check
        run: python3 tools/docs.py

      # A line that continues a command of a block is indented under the command's text.
      - name: Indented
        run: python3 tools/doc-indent.py
