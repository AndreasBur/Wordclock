# The Python tools this repository builds and checks with, pinned by uv.lock: one environment
# for all of them, the same in the dev container and in CI.
#
# The dev container builds it into /opt/wordclock-env when the image is made, and points
# UV_PROJECT_ENVIRONMENT there, so `uv run` uses that one rather than a .venv of its own; the
# tools are on PATH as well. CI makes it with `uv sync --frozen`. Updating a tool is changing its
# line here and running `uv lock`.
#
# The repository's own scripts in tools/ use the standard library only and are not a package:
# nothing here is installed from this directory.

[project]
name = "wordclock-tools"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # The ESP32 and RP2350 builds. Unpinned in CI before this, which is how 6.1.19 became 6.2.0
    # under the repository without anybody asking.
    "platformio==6.2.0",
    # tools/web-smoke.py. The version decides the Chromium it downloads, which the web job caches.
    "playwright==1.64.1",
    # The Python scripts, read with the checks [tool.ruff.lint] selects.
    "ruff",
    # The workflows. The binary, shipped as a wheel so that this lockfile pins it.
    "actionlint-py",
]

[tool.uv]
package = false
default-groups = ["dev"]
# A floor, not a pin. PlatformIO 6.2 brings a uv of its own and runs it inside this repository
# to fill the ESP32 platform's environment, and that uv reads this file too: an exact version
# here stopped the ESP32 build. The uv that syncs this project is pinned where it is installed -
# the ARG UV_VERSION of .devcontainer/Dockerfile, which .github/actions/uv-sync reads as well.
required-version = ">=0.12.0"

# The same rule as .clang-tidy: the checks that answer "is this wrong" and none that argue with
# how the code is written. F is pyflakes - an undefined name, an import nobody uses, a variable
# assigned and never read - and E9 is a file Python cannot parse. The style checks are left out:
# they would report the 100-column lines and the layout the scripts are written in, and a check
# answered by "no, on purpose" a hundred times is a check nobody reads.
#
# A name SCons injects into a PlatformIO script - env, Import - is undefined to pyflakes and is
# answered where it is used, with a `# noqa: F821`.
[tool.ruff.lint]
select = ["F", "E9"]
