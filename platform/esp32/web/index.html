<!--
  The web console. One self-contained file: no external stylesheet, script or font,
  because the clock serves it from its own flash and has nowhere to fetch anything from.

  It speaks the serial protocol from docs/serial-commands.md over a web socket, so it
  needs no protocol of its own - what is typed here goes into the same parser as what is
  typed on the wire.

  While the layout is being worked on, this file can be opened straight from disk instead
  of being flashed: the socket address then falls back to the prompt below rather than to
  the page's own host.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordclock</title>

<style>
    /* Light is the base, dark the alternative. The clock's own look is amber on a
       near-black panel, but the console is usually read next to other light windows - and a
       page that arrives dark on a light desktop is the more jarring of the two.

       Three rules rather than one: the tokens as they are, the dark set when the system asks
       for it and nothing was chosen by hand, and the dark set again when it was. The dark
       values appear twice for that reason - resolving the system preference in script
       instead would work, but the page would flash light before the script runs.
       color-scheme comes along so the native controls, the dropdowns and the scrollbars
       follow rather than staying light on a dark page. */
    :root, :root[data-theme="light"] {
        color-scheme: light;
        /* Neutral rather than the beige it was. Three near-black cards on a warm off-white
           read as a compromise between two ideas; on a grey they read as an instrument on a
           desk. */
        --panel: #eeeef1;
        --field: #ffffff;
        --text: #1e1e22;
        /* The surfaces' amber taken down until it holds on white - the same hue, so the page
           and the instrument are not two different oranges. */
        --lit: #b06a00;
        --unlit: #5f5f66;
        --line: #d9d9df;
        /* A console is read line by line, so it is capped rather than stretched: on a wide
           screen the full width leaves short lines floating in emptiness and pushes the
           send button a screen away from the field it belongs to. */
        --content: 900px;
        /* One scale instead of the 10/12/14/16/18 that had grown side by side. Three steps
           is enough for a page with four things on it, and a rhythm is most of what reads
           as tidy. */
        --gap: 8px;
        --gap-l: 16px;
        --pad: 20px;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            /* Below the surfaces rather than beside them: at #0e0e11 the page and the cards
               were within a few values of each other and only the borders separated them. */
            --panel: #08080b;
            --field: #17171b;
            --text: #d8d8de;
            /* The panel's amber, which is what the clock itself shows. */
            --lit: #ffb020;
            --unlit: #6a6a72;
            --line: #26262b;
        }
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --panel: #08080b;
        --field: #17171b;
        --text: #d8d8de;
        --lit: #ffb020;
        --unlit: #6a6a72;
        --line: #26262b;
    }
    /* The three surfaces - clock, console, builder - carry one face, and the same one in
       both themes. What varies with the theme is the page they sit on; what they are made of
       does not, because they are one instrument and a white console beside a black clock read
       as two unrelated things.

       Redefining the page's own tokens inside them is what makes this cheap: every input,
       select and button in there follows without a rule of its own. */
    .surface {
        --field: #1b1b22;
        --text: #e6e6ea;
        --unlit: #7a7a86;
        --line: #2b2b34;
        --lit: #ffb020;
        background: #14141a;
        border: 1px solid #24242c;
        border-radius: 10px;
        color: var(--text);
    }
    * { box-sizing: border-box; }
    .bar { width: 100%; max-width: var(--content); margin-inline: auto; }
    body {
        margin: 0;
        /* At least the viewport, and more when what is on it needs more. Exactly 100vh was
           right while everything below the clock had a fixed height; it stopped being right
           when the clock was allowed to shrink, because then there was no point at which the
           page had to grow instead. */
        min-height: 100vh;
        background: var(--panel);
        color: var(--unlit);
        font: 15px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
        display: flex;
        flex-direction: column;
    }
    header {
        border-bottom: 1px solid var(--line);
        padding: var(--gap-l) 0;
        flex: none;
    }
    header .bar { display: flex; align-items: center; gap: var(--gap-l); padding: 0 var(--pad); }
    h1 { margin: 0; font-size: 14px; letter-spacing: .22em; color: var(--lit); font-weight: 700; }
    /* A dot beside the word rather than the word alone: connected and connecting differ by
       two letters read at a glance, and by a colour read without reading.

       A pseudo-element and not a span, because the script sets state.textContent on every
       change - an element inside would be wiped by the first reconnect. */
    #state { font-size: 13px; display: flex; align-items: center; gap: var(--gap); }
    #state::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--unlit);
        flex: none;
    }
    #state.up::before { background: var(--lit); }
    #state.up { color: var(--lit); }
    #theme { margin-left: auto; padding: 5px 12px; font-size: 13px; }

    /* The shared look of every control, which the console card then overrides for the one
       input that lives inside it. Cut out by accident when the console was rebuilt, which
       cost the input its flex and the buttons their colour - and the builder's dropdowns
       with them, two cards further down where nobody was looking. */
    input, button, select {
        font: inherit;
        color: inherit;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
    }
    input { flex: 1; min-width: 0; }
    input:focus, button:focus, select:focus { outline: 2px solid var(--lit); outline-offset: 1px; }
    button { color: var(--lit); cursor: pointer; }

    /* The console. One card so that the answer and the question sit in the same object -
       and so the page is a column of three things rather than a stack of bands. */
    #console {
        flex: none;
        width: 100%;
        max-width: var(--content);
        margin: 0 auto var(--gap);
        overflow: hidden;
    }
    /* One line, scrolled rather than grown: what a reader wants is the answer that just
       came back, and append() already brings it into view. Every pixel beyond that line was
       one the clock could have had. */
    #log {
        /* A field of its own beside the input's, same border, same background, same height:
           40 outside, 38 inside, which is what the input comes to with its own border and
           padding.

           The line is centred by line-height rather than by padding, and that is the whole
           trick: padding on a scroll container belongs to the scrollport, so a one-line field
           with padding shows one line and a sliver of the one above it. A line-height that
           fills the box leaves exactly one line visible and scrolls by exactly one. */
        height: 40px;
        line-height: 38px;
        margin: 6px 6px 0;
        padding: 0 12px;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
        scrollbar-width: thin;
        scrollbar-color: var(--unlit) transparent;
    }
    #log:empty::before { content: 'no output yet'; color: var(--unlit); font-style: italic; }
    #log .out { color: var(--text); }
    #log .in  { color: var(--lit); }
    #log .note { color: var(--unlit); font-style: italic; }

    /* Inside the card, so the input carries no frame of its own - the card is the frame. */
    /* align-items:center rather than the default stretch, and the same padding as the
       button, so the two are one height centred on one line. The focus ring sits flush
       instead of a pixel proud, which is what made the field look taller than Send. */
    #entry {
        display: flex;
        align-items: center;
        gap: 6px;
        /* A form carries a bottom margin of its own unless it is told not to, which put more
           air under the row than over it - the row sat low in its strip rather than in the
           middle of it, and no amount of align-items was going to fix that. */
        margin: 0;
        padding: 6px;
    }
    /* Frameless until it is focused, and then the ring is the input's own - an inset shadow
       on the row was square, because the row has no radius, and reached around the Send
       button, because the button is in the row too. The radius is kept even with no border
       so the outline has something to follow. */
    /* No override at all: the shared input/button/select rule already gives the field the
       button's border, background, radius and padding, which is exactly what makes the two
       read as a pair. Making it frameless "because the card is the frame" was a nice idea
       that left one of the two looking like the odd one out. */
    /* The ring inside the box, not around it. An outline is drawn outside the border box, so
       a focused field stood four pixels taller than the button beside it however carefully
       the two were matched. Border plus an inset shadow gives the same two pixels of amber
       and changes no height at all. */
    #entry input:focus {
        outline: none;
        border-color: var(--lit);
        box-shadow: inset 0 0 0 1px var(--lit);
    }

    /* The builder. Collapsed by default: typing a command is the faster path once one
       knows it, and the form is what makes it findable in the first place. In the same
       column as the console rather than a band across the page. */
    details {
        flex: none;
        width: 100%;
        max-width: var(--content);
        margin: 0 auto var(--gap);
        overflow: hidden;
    }
    /* Three insets down the whole page, and only three: a card edge at 0, a control box at
       6, and text at 19 - which is the 6 plus a control's own border and padding. The two
       cards had 6 and 14 and nothing lined up with anything vertically. */
    summary { padding: 10px 19px; cursor: pointer; color: var(--lit); font-size: 13px; }
    /* Two columns, so the preview and the button that takes it sit on one line the way the
       console's input and Send do. Everything above them spans both: the command and its
       options are the form, the last row is what you do with it. */
    #builder {
        padding: 0 6px 6px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--gap);
        align-items: center;
    }
    #builder > #commands,
    #builder > #options { grid-column: 1 / -1; }
    #builder #use { justify-self: end; }
    #builder[hidden] { display: none; }
    .row { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 10px; align-items: center; }
    /* Ticked or not, said in one colour rather than in opacity. Opacity was the first
       attempt and it does not work here: it scales everything by the same factor, so a
       select showing a real value stayed brighter than an input showing a placeholder, which
       is the very difference that was meant to disappear.

       A select cannot be empty, so an unticked one is dimmed to the same token a placeholder
       uses - and both say the same thing, that nothing here is going into the command. */
    .row label { color: var(--unlit); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #builder ::placeholder { color: var(--unlit); opacity: 1; }
    .row:not(:has(input[type=checkbox]:checked)) select { color: var(--unlit); }
    .row:has(input[type=checkbox]:checked) label { color: var(--text); }
    .row select { transition: color 90ms linear; }
    .row input[type=checkbox] { flex: none; width: 16px; height: 16px; accent-color: var(--lit); }
    #preview {
        font-family: inherit;
        color: var(--lit);
        background: var(--field);
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        min-height: 20px;
        word-break: break-all;
    }
    #preview:empty::before { content: 'pick a command'; color: var(--unlit); font-style: italic; }
    /* The panel, centred above the log because it is the thing one actually looks at.
       Sized by the height that is left, not by the width it would like. A grid that grew to
       max-width and squared its cells was taller than the screen on its own, and pushed the
       console it is read with off the bottom - the letters are the thing one looks at, but a
       word clock nobody can type at is a picture.

       So the height leads and the width follows from the shape, which /display supplies and
       script writes into --shape. --panel-height is the one number to turn: raise it for a
       bigger clock and less console, lower it for the other way round. The vw term in it is
       what keeps a narrow window from making the grid wider than the page. */
    #panel {
        /* Its own face, and the same one in both themes. A word clock is an object: a light
           page around a light clock reads as letters in a table, which is what this looked
           like. The tokens are redefined here rather than at :root so only the clock takes
           them - the console around it goes on following whatever theme is chosen. */
        --matrix-unlit: #2f2f39;
        --matrix-lit: #f4f4f6;
        /* Defined here and nowhere else: they used to sit at :root once per theme, which
           stopped meaning anything the moment the clock kept one face in both. */
        /* No height of its own, and deliberately no arithmetic either. Both a fraction of
           the viewport and a subtraction from it were guesses about how tall everything else
           is - and everything else is not one height, because opening the command builder
           adds some three hundred pixels. Both guesses cut the top off the clock the moment
           it was opened.

           So the clock takes what the flex column has left and gives it back when the
           builder wants it: flex sets the height, the shape derives the width from it, and
           min-height:0 is what allows the shrink at all. */
        /* Shrinks to give the builder room, but not past the point of being a clock. Without
           a floor it went to a postage stamp the moment nine option rows opened below it -
           which is the sort of obedience nobody asked for. Past this, the page scrolls. */
        flex: 1 1 auto;
        min-height: 200px;
        align-self: center;
        height: auto;

        /* content-box against the global border-box, on purpose: aspect-ratio applies to
           whichever box that names, and with the padding counted in, the cells would be
           slightly wider than tall. The ratio has to be the grid's, not the frame's. */
        box-sizing: content-box;
        display: grid;
        gap: 2px;
        /* A size container, so the letters can be measured against the clock rather than
           against the window: the panel now shrinks when the builder opens, and a font tied
           to vh does not shrink with it - the last rows walked straight out of the frame.
           overflow:hidden is the backstop, because a letter escaping its own display is the
           one thing that must not survive a bad number. */
        container-type: size;
        overflow: hidden;
        aspect-ratio: var(--shape, 11 / 10);
        width: auto;
        max-width: 100%;
        margin: var(--gap-l) auto;
        padding: var(--gap-l) var(--pad);
    }
    #panel span {
        /* No ratio of its own: the panel carries the shape and the tracks are equal
           fractions of it, so a cell is square because the grid is. One cell insisting on
           being square was what made the grid taller than its container. */
        display: grid;
        place-items: center;
        font-weight: 700;
        /* Unlit letters stay faintly readable rather than vanishing. The panel itself hides
           them, but a view one reads wants the grid visible - the same choice the wx window
           makes with its light grey. */
        color: var(--matrix-unlit);
        /* Six tenths of a cell, and a cell is the panel's height divided by its rows -
           which script writes into --rows, because /display decides the shape. cqh is what
           makes that the panel's height and not the window's. */
        font-size: clamp(7px, calc(60cqh / var(--rows, 10)), 22px);
        transition: color 90ms linear, text-shadow 90ms linear;
    }
    /* Fixed rather than the pixel's own colour, so a word stays readable at every
       brightness; see showFrame() for why the frame's colour is not painted. The glow is
       what makes it read as a lit LED rather than as bold text - amber because that is what
       the clock itself shows, on a white letter because white is what stays legible. */
    #panel span.lit {
        color: var(--matrix-lit);
        text-shadow: 0 0 10px rgba(255, 176, 32, 0.45);
    }
    #panel[hidden] { display: none; }
    #builderNote { color: var(--unlit); font-style: italic; padding: 0 19px 12px; max-width: var(--content); margin-inline: auto; }
</style>

<header>
    <div class="bar">
        <h1>WORDCLOCK</h1>
        <span id="state">connecting…</span>
        <button type="button" id="theme" title="Switch between the dark and the light theme"></button>
    </div>
</header>

<div id="panel" class="surface" hidden></div>

<!-- One card, because they are one thing: what was asked and what came back. They used to
     be a bare strip and a separate field with the command builder wedged between them, which
     read as three unrelated bands down the page. -->
<section id="console" class="surface">
    <div id="log"></div>
    <form id="entry">
        <input id="command" placeholder="command, e.g. 3 -B255" autocomplete="off" spellcheck="false" autofocus>
        <button type="submit">Send</button>
    </form>
</section>

<details id="builderBox" class="surface">
    <summary>Build a command</summary>
    <div id="builderNote" hidden></div>
    <div id="builder">
        <select id="commands"></select>
        <div id="options"></div>
        <div id="preview"></div>
        <button type="button" id="use">Use</button>
    </div>
</details>

<script>
    const log = document.getElementById('log');
    const state = document.getElementById('state');
    const entry = document.getElementById('entry');
    const commandInput = document.getElementById('command');

    /* ---- theme ---------------------------------------------------------------------
       Nothing is stored until the button is pressed: without a stored choice the page
       follows the system, which the stylesheet already does on its own. The button then
       overrides it, and says what it would switch to rather than what is showing. */
    const themeButton = document.getElementById('theme');

    function systemTheme() {
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function currentTheme() {
        return document.documentElement.dataset.theme || systemTheme();
    }

    function showTheme() {
        themeButton.textContent = currentTheme() === 'dark' ? 'light' : 'dark';
    }

    themeButton.addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('wordclock-theme', next);
        showTheme();
    });

    /* Follows the system while nothing was chosen by hand, so a machine switching at dusk
       takes the page with it. */
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', showTheme);

    const storedTheme = localStorage.getItem('wordclock-theme');
    if (storedTheme) { document.documentElement.dataset.theme = storedTheme; }
    showTheme();

    function append(text, kind) {
        const line = document.createElement('div');
        line.className = kind;
        line.textContent = text;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    /* Served from the clock, this is the clock. Opened from disk while the layout is being
       worked on, there is no host to talk to, so ask for one - that is what keeps the edit
       cycle a browser reload instead of a flash. */
    function socketUrl() {
        if (location.protocol === 'file:') {
            const host = localStorage.getItem('wordclock-host') || prompt('Address of the clock', 'wordclock.local');
            if (!host) { return null; }
            localStorage.setItem('wordclock-host', host);
            return 'ws://' + host + '/ws';
        }
        return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    }

    /* The clock reboots on a firmware update and drops every socket with it, so coming back
       on our own is the normal case rather than an error. */
    const RETRY_MS = 2000;
    let socket = null;
    let attempts = 0;

    /* Same fallback as the socket: opened from disk there is no own host to ask, so the
       address the socket already stored is used. */
    function endpoint(path) {
        if (location.protocol === 'file:') {
            const host = localStorage.getItem('wordclock-host');
            return host ? 'http://' + host + '/' + path : path;
        }
        return path;
    }

    function connect() {
        const url = socketUrl();
        if (!url) { state.textContent = 'no address'; return; }

        socket = new WebSocket(url);

        socket.onopen = () => {
            if (attempts > 0) { append('connected', 'note'); }
            attempts = 0;
            state.textContent = 'connected';
            state.classList.add('up');
        };
        socket.binaryType = 'arraybuffer';
        socket.onmessage = (event) => {
            if (typeof event.data === 'string') { append(event.data, 'out'); return; }
            showFrame(new Uint8Array(event.data));
        };
        socket.onclose = () => {
            attempts++;
            state.classList.remove('up');
            state.textContent = 'reconnecting… (' + attempts + ')';
            /* Reported once per outage rather than once per attempt: retrying every two
               seconds forever, a line each time buries everything else in the log within a
               minute - which is exactly what the state line above is for. */
            if (attempts === 1) { append('no connection - retrying every ' + (RETRY_MS / 1000) + 's', 'note'); }
            setTimeout(connect, RETRY_MS);
        };
    }

    /* ---- the panel -----------------------------------------------------------------
       The letters and the shape come from /display, which the clock generates from
       DisplayCharacters - so the browser carries no second copy of the letter table. The
       colours arrive as binary frames on the same socket, in the strip's own byte order.

       Unlike the wx window this can show the real colour: that one renders brightness as a
       grey level and drops the hue. */
    const panel = document.getElementById('panel');
    let cells = [];

    function buildPanel(shape) {
        /* Rows as well as columns, and the shape as the panel's own ratio: the height is
           what the stylesheet fixes, so the width has to be derived from these. */
        /* minmax(0, 1fr) rather than 1fr: a plain fr track floors at its content, so the
           grid refused to shrink past the letters and overflowed the frame instead. */
        panel.style.gridTemplateColumns = `repeat(${shape.columns}, minmax(0, 1fr))`;
        panel.style.gridTemplateRows = `repeat(${shape.rows}, minmax(0, 1fr))`;
        panel.style.setProperty('--rows', shape.rows);
        panel.style.setProperty('--shape', `${shape.columns} / ${shape.rows}`);
        panel.textContent = '';
        cells = [...shape.letters].map((letter) => {
            const cell = document.createElement('span');
            cell.textContent = letter;
            panel.appendChild(cell);
            return cell;
        });
        panel.hidden = cells.length === 0;
    }

    function showFrame(bytes) {
        /* Green, red, blue - the strip's order, which is what the buffer holds.
           Only whether a pixel is lit is taken from it, not its colour: the bytes arrive
           already dimmed, so painting them would make a word at low brightness a dark
           grey on a dark background - unreadable in exactly the case one opens this view
           to read. The lit ones get a fixed high-contrast colour instead, and the wx
           window stays the colour-accurate view. Brightness still shows here as the one
           step that matters to a reader: at zero every byte is zero and the panel
           blanks. */
        for (let index = 0; index < cells.length; index++) {
            const at = index * 3;
            const green = bytes[at], red = bytes[at + 1], blue = bytes[at + 2];

            cells[index].classList.toggle('lit', Boolean(red || green || blue));
        }
    }

    fetch(endpoint('display'))
        .then((response) => response.json())
        .then(buildPanel)
        .catch(() => { /* No panel then; the console below is the part that matters. */ });

    /* ---- the command builder ------------------------------------------------------
       Everything below is generated from what /commands serves, which the clock in turn
       generates from MessageCatalog. Nothing about the commands is written down here, so
       a command added to that table appears in this form on its own. */
    const TYPE_STRING = 2;   /* MessageCatalog::ARGUMENT_TYPE_STRING */

    const commandsSelect = document.getElementById('commands');
    const optionsBox = document.getElementById('options');
    const preview = document.getElementById('preview');
    const builderBox = document.getElementById('builderBox');
    let catalog = [];

    builderBox.addEventListener('toggle', () => {
        if (!builderBox.open) { return; }
        requestAnimationFrame(() => builderBox.scrollIntoView({
            behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'start'
        }));
    });

    function selectedCommand() {
        return catalog[commandsSelect.selectedIndex];
    }

    /* "2 -R255 -G128" - the same shape the wx message builder produces, because it is the
       shape the parser expects. */
    function buildCommand() {
        const command = selectedCommand();
        if (!command) { return ''; }

        let text = String(command.number);
        for (const row of optionsBox.children) {
            if (!row.querySelector('input[type=checkbox]').checked) { continue; }
            const field = row.querySelector('[data-value]');
            text += ' -' + row.dataset.short + (field ? field.value : '');
        }
        return text;
    }

    function refreshPreview() {
        preview.textContent = buildCommand();
    }

    function optionField(option) {
        /* Named values become a dropdown, so they are picked by name rather than by the
           number the protocol carries - which is the whole point of the catalog. */
        if (option.values) {
            const select = document.createElement('select');
            select.dataset.value = '';
            option.values.forEach((name, index) => {
                const item = document.createElement('option');
                item.value = String(option.min + index);
                item.textContent = (option.min + index) + '  ' + name;
                select.appendChild(item);
            });
            return select;
        }

        const field = document.createElement('input');
        field.dataset.value = '';
        if (option.type === TYPE_STRING) {
            field.placeholder = 'text';
        } else {
            field.type = 'number';
            field.min = option.min;
            field.max = option.max;
            field.placeholder = option.min + '..' + option.max;
        }
        return field;
    }

    function showOptions() {
        optionsBox.textContent = '';
        const command = selectedCommand();
        if (!command) { refreshPreview(); return; }

        for (const option of command.options) {
            /* A field that only ever comes back in an answer gets no row: the command
               takes no such option, and the firmware answers one with "parameter
               unknown". Its name is in the catalog so that the answer can be read
               through it, not so that it can be sent. */
            if (option.readonly) { continue; }

            const row = document.createElement('div');
            row.className = 'row';
            row.dataset.short = option.short;

            const use = document.createElement('input');
            use.type = 'checkbox';

            const label = document.createElement('label');
            label.textContent = '-' + option.short + '  ' + option.label;

            row.append(use, label, optionField(option));
            optionsBox.appendChild(row);
        }
        refreshPreview();
    }

    commandsSelect.addEventListener('change', () => {
        showOptions();
        requestAnimationFrame(() => document.getElementById('use').scrollIntoView({
            behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'end'
        }));
    });
    optionsBox.addEventListener('input', refreshPreview);
    optionsBox.addEventListener('change', refreshPreview);

    /* Into the input field rather than straight onto the wire, so it can still be looked
       over and corrected - the same thing the wx builder's Insert does. */
    document.getElementById('use').addEventListener('click', () => {
        commandInput.value = buildCommand();
        document.getElementById('builderBox').open = false;
        commandInput.focus();
    });

    fetch(endpoint('commands'))
        .then((response) => response.json())
        .then((loaded) => {
            catalog = loaded;
            for (const entry of catalog) {
                const item = document.createElement('option');
                item.textContent = entry.number + '  ' + entry.label;
                commandsSelect.appendChild(item);
            }
            showOptions();
        })
        .catch(() => {
            /* An empty dropdown over an empty option list is worse than no form at all: it
               looks like the clock has no commands rather than like the page could not
               reach it. */
            const note = document.getElementById('builderNote');
            note.textContent = location.protocol === 'file:'
                ? 'The command list comes from the clock. Opened from disk, it is reachable only once the address above connects.'
                : 'The command list could not be loaded from the clock.';
            note.hidden = false;
            document.getElementById('builder').hidden = true;
        });

    entry.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = commandInput.value.trim();
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) { return; }

        append(text, 'in');
        socket.send(text);
        commandInput.value = '';
    });

    connect();
</script>
