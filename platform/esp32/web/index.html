<!--
  The web console. One self-contained file: no external stylesheet, script or font,
  because the clock serves it from its own flash and has nowhere to fetch anything from.

  It speaks the serial protocol from docs/serial-commands.md over a web socket, so it
  needs no protocol of its own - what is typed here goes into the same parser as what is
  typed on the wire.

  While the layout is being worked on, this file can be opened straight from disk instead
  of being flashed: the socket address then falls back to the prompt below rather than to
  the page's own host.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordclock</title>

<style>
    /* Light is the base, dark the alternative. The clock's own look is amber on a
       near-black panel, but the console is usually read next to other light windows - and a
       page that arrives dark on a light desktop is the more jarring of the two.

       Three rules rather than one: the tokens as they are, the dark set when the system asks
       for it and nothing was chosen by hand, and the dark set again when it was. The dark
       values appear twice for that reason - resolving the system preference in script
       instead would work, but the page would flash light before the script runs.
       color-scheme comes along so the native controls, the dropdowns and the scrollbars
       follow rather than staying light on a dark page. */
    :root, :root[data-theme="light"] {
        color-scheme: light;
        --panel: #f6f6f3;
        --field: #ffffff;
        --text: #1e1e22;
        /* Darker than the panel's own amber, which on white would be barely legible. */
        --lit: #9a5b00;
        --unlit: #5f5f66;
        --matrix-unlit: #c4c4c4;
        --matrix-unlit-stroke: transparent;
        --matrix-lit: #111116;
        --line: #dcdcd6;
        /* A console is read line by line, so it is capped rather than stretched: on a wide
           screen the full width leaves short lines floating in emptiness and pushes the
           send button a screen away from the field it belongs to. */
        --content: 900px;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --panel: #0e0e11;
            --field: #17171b;
            --text: #d8d8de;
            /* The panel's amber, which is what the clock itself shows. */
            --lit: #ffb020;
            --unlit: #6a6a72;
            --matrix-unlit: #303038;
            --matrix-unlit-stroke: transparent;
            --matrix-lit: #f2f2f4;
            --line: #26262b;
        }
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --panel: #0e0e11;
        --field: #17171b;
        --text: #d8d8de;
        --lit: #ffb020;
        --unlit: #6a6a72;
        --matrix-unlit: #303038;
        --matrix-unlit-stroke: transparent;
        --matrix-lit: #f2f2f4;
        --line: #26262b;
    }
    * { box-sizing: border-box; }
    .bar { width: 100%; max-width: var(--content); margin-inline: auto; }
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--panel);
        color: var(--unlit);
        font: 15px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
        display: flex;
        flex-direction: column;
    }
    header {
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
    }
    header .bar { display: flex; align-items: baseline; gap: 14px; padding: 0 18px; }
    h1 { margin: 0; font-size: 15px; letter-spacing: .18em; color: var(--lit); font-weight: 700; }
    #state { font-size: 13px; }
    #state.up { color: var(--lit); }
    #theme { margin-left: auto; padding: 4px 10px; font-size: 13px; }
    #log {
        flex: 1;
        margin: 0 auto;
        width: 100%;
        max-width: var(--content);
        padding: 14px 18px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
    }
    #log .out { color: var(--text); }
    #log .in  { color: var(--lit); }
    #log .note { color: var(--unlit); font-style: italic; }
    form { border-top: 1px solid var(--line); padding: 12px 0; }
    form .bar { display: flex; gap: 10px; padding: 0 18px; }
    input, button, select {
        font: inherit;
        color: inherit;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
    }
    input { flex: 1; min-width: 0; }
    input:focus, button:focus, select:focus { outline: 2px solid var(--lit); outline-offset: 1px; }
    button { color: var(--lit); cursor: pointer; }

    /* The builder. Collapsed by default: typing a command is the faster path once one
       knows it, and the form is what makes it findable in the first place. */
    details { border-top: 1px solid var(--line); }
    summary { padding: 10px 18px; cursor: pointer; color: var(--lit); max-width: var(--content); margin-inline: auto; }
    #builder {
        padding: 0 18px 12px;
        display: grid;
        gap: 8px;
        width: max-content;
        min-width: min(100%, var(--content));
        max-width: 100%;
        margin-inline: auto;
    }
    /* The button sits at its natural width on the right rather than spanning the column -
       a full-width button reads as the page's main action, which it is not. */
    #builder #use { justify-self: end; }
    #builder[hidden] { display: none; }
    .row { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 10px; align-items: center; }
    .row label { color: var(--unlit); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row input[type=checkbox] { flex: none; width: 16px; height: 16px; accent-color: var(--lit); }
    #preview {
        font-family: inherit;
        color: var(--lit);
        background: var(--field);
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        min-height: 20px;
        word-break: break-all;
    }
    #preview:empty::before { content: 'pick a command'; color: var(--unlit); font-style: italic; }
    /* The panel. Square cells so it reads as a matrix rather than as stretched columns,
       and centred above the log because it is the thing one actually looks at. */
    #panel {
        display: grid;
        gap: 2px;
        padding: 16px 18px 4px;
        width: 100%;
        max-width: 720px;
        margin-inline: auto;
    }
    #panel span {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        font-weight: 700;
        /* Unlit letters stay faintly readable rather than vanishing. The panel itself hides
           them, but a view one reads wants the grid visible - the same choice the wx window
           makes with its light grey. */
        color: var(--matrix-unlit);
        -webkit-text-stroke: 1px var(--matrix-unlit-stroke);
        font-size: clamp(15px, 2vw, 21px);
        transition: color 90ms linear;
    }
    #panel span.lit {
        color: var(--matrix-lit);
        -webkit-text-stroke-color: transparent;
    }
    #panel[hidden] { display: none; }
    #builderNote { color: var(--unlit); font-style: italic; padding: 0 18px 12px; max-width: var(--content); margin-inline: auto; }
</style>

<header>
    <div class="bar">
        <h1>WORDCLOCK</h1>
        <span id="state">connecting…</span>
        <button type="button" id="theme" title="Switch between the dark and the light theme"></button>
    </div>
</header>

<div id="panel" hidden></div>

<div id="log"></div>

<details id="builderBox">
    <summary>Build a command</summary>
    <div id="builderNote" hidden></div>
    <div id="builder">
        <select id="commands"></select>
        <div id="options"></div>
        <div id="preview"></div>
        <button type="button" id="use">Use</button>
    </div>
</details>

<form id="entry">
    <div class="bar">
        <input id="command" placeholder="command, e.g. 3 -B255" autocomplete="off" spellcheck="false" autofocus>
        <button type="submit">Send</button>
    </div>
</form>

<script>
    const log = document.getElementById('log');
    const state = document.getElementById('state');
    const entry = document.getElementById('entry');
    const commandInput = document.getElementById('command');

    /* ---- theme ---------------------------------------------------------------------
       Nothing is stored until the button is pressed: without a stored choice the page
       follows the system, which the stylesheet already does on its own. The button then
       overrides it, and says what it would switch to rather than what is showing. */
    const themeButton = document.getElementById('theme');

    function systemTheme() {
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function currentTheme() {
        return document.documentElement.dataset.theme || systemTheme();
    }

    function showTheme() {
        themeButton.textContent = currentTheme() === 'dark' ? 'light' : 'dark';
    }

    themeButton.addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('wordclock-theme', next);
        showTheme();
    });

    /* Follows the system while nothing was chosen by hand, so a machine switching at dusk
       takes the page with it. */
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', showTheme);

    const storedTheme = localStorage.getItem('wordclock-theme');
    if (storedTheme) { document.documentElement.dataset.theme = storedTheme; }
    showTheme();

    function append(text, kind) {
        const line = document.createElement('div');
        line.className = kind;
        line.textContent = text;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    /* Served from the clock, this is the clock. Opened from disk while the layout is being
       worked on, there is no host to talk to, so ask for one - that is what keeps the edit
       cycle a browser reload instead of a flash. */
    function socketUrl() {
        if (location.protocol === 'file:') {
            const host = localStorage.getItem('wordclock-host') || prompt('Address of the clock', 'wordclock.local');
            if (!host) { return null; }
            localStorage.setItem('wordclock-host', host);
            return 'ws://' + host + '/ws';
        }
        return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    }

    /* The clock reboots on a firmware update and drops every socket with it, so coming back
       on our own is the normal case rather than an error. */
    const RETRY_MS = 2000;
    let socket = null;
    let attempts = 0;

    /* Same fallback as the socket: opened from disk there is no own host to ask, so the
       address the socket already stored is used. */
    function endpoint(path) {
        if (location.protocol === 'file:') {
            const host = localStorage.getItem('wordclock-host');
            return host ? 'http://' + host + '/' + path : path;
        }
        return path;
    }

    function connect() {
        const url = socketUrl();
        if (!url) { state.textContent = 'no address'; return; }

        socket = new WebSocket(url);

        socket.onopen = () => {
            if (attempts > 0) { append('connected', 'note'); }
            attempts = 0;
            state.textContent = 'connected';
            state.classList.add('up');
        };
        socket.binaryType = 'arraybuffer';
        socket.onmessage = (event) => {
            if (typeof event.data === 'string') { append(event.data, 'out'); return; }
            showFrame(new Uint8Array(event.data));
        };
        socket.onclose = () => {
            attempts++;
            state.classList.remove('up');
            state.textContent = 'reconnecting… (' + attempts + ')';
            /* Reported once per outage rather than once per attempt: retrying every two
               seconds forever, a line each time buries everything else in the log within a
               minute - which is exactly what the state line above is for. */
            if (attempts === 1) { append('no connection - retrying every ' + (RETRY_MS / 1000) + 's', 'note'); }
            setTimeout(connect, RETRY_MS);
        };
    }

    /* ---- the panel -----------------------------------------------------------------
       The letters and the shape come from /display, which the clock generates from
       DisplayCharacters - so the browser carries no second copy of the letter table. The
       colours arrive as binary frames on the same socket, in the strip's own byte order.

       Unlike the wx window this can show the real colour: that one renders brightness as a
       grey level and drops the hue. */
    const panel = document.getElementById('panel');
    let cells = [];

    function buildPanel(shape) {
        panel.style.gridTemplateColumns = `repeat(${shape.columns}, 1fr)`;
        panel.textContent = '';
        cells = [...shape.letters].map((letter) => {
            const cell = document.createElement('span');
            cell.textContent = letter;
            panel.appendChild(cell);
            return cell;
        });
        panel.hidden = cells.length === 0;
    }

    function showFrame(bytes) {
        /* Green, red, blue - the strip's order, which is what the buffer holds. */
        for (let index = 0; index < cells.length; index++) {
            const at = index * 3;
            const green = bytes[at], red = bytes[at + 1], blue = bytes[at + 2];
            const lit = Boolean(red || green || blue);

            cells[index].classList.toggle('lit', lit);
            cells[index].style.setProperty('--pixel-color', `rgb(${red} ${green} ${blue})`);
        }
    }

    fetch(endpoint('display'))
        .then((response) => response.json())
        .then(buildPanel)
        .catch(() => { /* No panel then; the console below is the part that matters. */ });

    /* ---- the command builder ------------------------------------------------------
       Everything below is generated from what /commands serves, which the clock in turn
       generates from MessageCatalog. Nothing about the commands is written down here, so
       a command added to that table appears in this form on its own. */
    const TYPE_STRING = 2;   /* MessageCatalog::ARGUMENT_TYPE_STRING */

    const commandsSelect = document.getElementById('commands');
    const optionsBox = document.getElementById('options');
    const preview = document.getElementById('preview');
    const builderBox = document.getElementById('builderBox');
    let catalog = [];

    builderBox.addEventListener('toggle', () => {
        if (!builderBox.open) { return; }
        requestAnimationFrame(() => builderBox.scrollIntoView({
            behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'start'
        }));
    });

    function selectedCommand() {
        return catalog[commandsSelect.selectedIndex];
    }

    /* "2 -R255 -G128" - the same shape the wx message builder produces, because it is the
       shape the parser expects. */
    function buildCommand() {
        const command = selectedCommand();
        if (!command) { return ''; }

        let text = String(command.number);
        for (const row of optionsBox.children) {
            if (!row.querySelector('input[type=checkbox]').checked) { continue; }
            const field = row.querySelector('[data-value]');
            text += ' -' + row.dataset.short + (field ? field.value : '');
        }
        return text;
    }

    function refreshPreview() {
        preview.textContent = buildCommand();
    }

    function optionField(option) {
        /* Named values become a dropdown, so they are picked by name rather than by the
           number the protocol carries - which is the whole point of the catalog. */
        if (option.values) {
            const select = document.createElement('select');
            select.dataset.value = '';
            option.values.forEach((name, index) => {
                const item = document.createElement('option');
                item.value = String(option.min + index);
                item.textContent = (option.min + index) + '  ' + name;
                select.appendChild(item);
            });
            return select;
        }

        const field = document.createElement('input');
        field.dataset.value = '';
        if (option.type === TYPE_STRING) {
            field.placeholder = 'text';
        } else {
            field.type = 'number';
            field.min = option.min;
            field.max = option.max;
            field.placeholder = option.min + '..' + option.max;
        }
        return field;
    }

    function showOptions() {
        optionsBox.textContent = '';
        const command = selectedCommand();
        if (!command) { refreshPreview(); return; }

        for (const option of command.options) {
            /* A field that only ever comes back in an answer gets no row: the command
               takes no such option, and the firmware answers one with "parameter
               unknown". Its name is in the catalog so that the answer can be read
               through it, not so that it can be sent. */
            if (option.readonly) { continue; }

            const row = document.createElement('div');
            row.className = 'row';
            row.dataset.short = option.short;

            const use = document.createElement('input');
            use.type = 'checkbox';

            const label = document.createElement('label');
            label.textContent = '-' + option.short + '  ' + option.label;

            row.append(use, label, optionField(option));
            optionsBox.appendChild(row);
        }
        refreshPreview();
    }

    commandsSelect.addEventListener('change', () => {
        showOptions();
        requestAnimationFrame(() => document.getElementById('use').scrollIntoView({
            behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'end'
        }));
    });
    optionsBox.addEventListener('input', refreshPreview);
    optionsBox.addEventListener('change', refreshPreview);

    /* Into the input field rather than straight onto the wire, so it can still be looked
       over and corrected - the same thing the wx builder's Insert does. */
    document.getElementById('use').addEventListener('click', () => {
        commandInput.value = buildCommand();
        document.getElementById('builderBox').open = false;
        commandInput.focus();
    });

    fetch(endpoint('commands'))
        .then((response) => response.json())
        .then((loaded) => {
            catalog = loaded;
            for (const entry of catalog) {
                const item = document.createElement('option');
                item.textContent = entry.number + '  ' + entry.label;
                commandsSelect.appendChild(item);
            }
            showOptions();
        })
        .catch(() => {
            /* An empty dropdown over an empty option list is worse than no form at all: it
               looks like the clock has no commands rather than like the page could not
               reach it. */
            const note = document.getElementById('builderNote');
            note.textContent = location.protocol === 'file:'
                ? 'The command list comes from the clock. Opened from disk, it is reachable only once the address above connects.'
                : 'The command list could not be loaded from the clock.';
            note.hidden = false;
            document.getElementById('builder').hidden = true;
        });

    entry.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = commandInput.value.trim();
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) { return; }

        append(text, 'in');
        socket.send(text);
        commandInput.value = '';
    });

    connect();
</script>
