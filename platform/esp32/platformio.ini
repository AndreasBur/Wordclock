; Wordclock, ESP32 backend.
;
; The firmware core is not copied or vendored in here: build_src_filter reaches into
; ../../firmware/src, and scripts/firmware_includes.py puts its header directories on the
; include path. There is therefore exactly one copy of the clock logic, shared with the
; simulator.
;
; Build and flash:
;   pio run -t upload -d platform/esp32
;   pio device monitor -d platform/esp32

[env:wordclock]
; REQUIRES Arduino core 3.x (ESP-IDF >= 5.1). Pixels.cpp uses the IDF 5 RMT driver,
; <driver/rmt_tx.h>; core 2.x ships IDF 4.4, where that header does not exist and the
; old <driver/rmt.h> API has different types. If the build fails on that include, the
; platform is too old - the pioarduino fork of this platform carries core 3.x:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<ver>/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; GPIO 10 - the strip's data pin, see DISPLAY_DATA_PIN in firmware/inc/Display/Display.h -
; is free on the S3. On a classic ESP32-WROOM it is not: GPIO 6..11 are wired to the flash
; chip there, so that board needs another pin.
board = esp32-s3-devkitc-1
framework = arduino

; C++17 to match what the firmware core is written against (inline statics, std::array).
; The GNU dialect rather than plain c++17 is load-bearing: newlib only declares itoa(),
; which OverlayDate uses, outside strict ANSI mode.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

build_src_filter =
    +<*>
    +<../../../firmware/src/>

extra_scripts =
    pre:scripts/firmware_includes.py
    pre:scripts/embed_web.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
