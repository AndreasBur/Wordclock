; Wordclock, RP2350 backend, for the Raspberry Pi Pico 2 W.
;
; The firmware core is not copied or vendored in here: build_src_filter reaches into
; ../../firmware/src, and scripts/firmware_includes.py puts its header directories on the
; include path. There is therefore exactly one copy of the clock logic, shared with the
; simulator and the ESP32.
;
; Build and flash:
;   pio run -t upload -d platform/rp2350
;   pio device monitor -d platform/rp2350

[env:wordclock]
; NOT the registry's `raspberrypi` platform: that one knows RP2040 only, and `pio boards`
; lists no rpipico2w at all with it installed. The community fork carries earlephilhower's
; core, which has had RP2350 and the Pico 2 W since 4.0. Same arrangement the ESP32 backend
; needs for its own reason, so the fork URL is a pattern here rather than an exception.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
; The fork can build either core; the mbed one has neither the PIO access this backend's
; WS2812 driver needs nor the Pico 2 W's WiFi.
board_build.core = earlephilhower

; GPIO 10 - the strip's data pin, see DISPLAY_DATA_PIN in firmware/inc/Display/Display.h -
; is free on the Pico 2 W and reaches a PIO block, which every GPIO on this part does.
; Unlike the ESP32 there is no pin range reserved for the flash chip to avoid.

; The settings are a single blob, for which the smallest filesystem this tool will make is
; already several times over - LittleFS rather than the EEPROM emulation because a file
; carries its own length, which is what Storage::read() compares against to catch a blob from
; another version of the settings.
;
; A megabyte, then, is not for them: it is for the firmware image. This board has no second
; app partition, so an update over the network is a *file* that the OTA loader at the front of
; every image copies into place on the next boot - and the file is the whole firmware, some
; 490 KB of it today. A megabyte holds that with room to double, and leaves 3 MB of the
; part's 4 for the sketch, which uses 12 % of it.
;
; What it costs is stated here because it is paid once and cannot be undone: the region grows
; downwards from the end of flash, so its start moves, and the filesystem that was mounted at
; the old start is not found at the new one. The settings go with it - the update that
; introduces updates is the one that has to be installed over USB and resets the clock's
; settings. Every update after it keeps them.
board_build.filesystem_size = 1m

; C++17 to match what the firmware core is written against (inline statics, std::array).
; The GNU dialect rather than plain c++17 is load-bearing: newlib only declares itoa(),
; which OverlayDate uses, outside strict ANSI mode.
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
    -std=gnu++17

; Ours only, not the libraries'. The ESP32 gets its HTTP server from the framework, which
; is built separately and never sees these; here the server is a lib_dep and is compiled
; with whatever stands in build_flags. With -Wextra there it buries our own diagnostics
; under a few hundred unused-parameter warnings from headers we do not own.
build_src_flags =
    -Wall
    -Wextra

; The IDF's esp_http_server has no counterpart in this core. ESPAsyncWebServer does both
; roles the console needs - the page and the socket, on one port and one path each - and
; supports RP2350 on top of RPAsyncTCP. Its textAll() also replaces the walk over the
; socket list that broadcastLine() has to do against the IDF.
lib_deps =
    https://github.com/ayushsharma82/RPAsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

build_src_filter =
    +<*>
    +<../../../firmware/src/>

extra_scripts =
    pre:scripts/firmware_includes.py
    pre:../scripts/embed_web.py

monitor_speed = 115200
